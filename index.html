<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raise Optimizer · Banker Edition</title>
    <meta name="description" content="Optimize raise structures with live market inputs." />
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root{--bg:#0b0d10;--panel:#12161b;--muted:#7c8a9a;--text:#e8eef5;--accent:#6ee7ff;--accent2:#b392f0;}
      html,body,#root{height:100%} body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue','Noto Sans',Arial,'Apple Color Emoji','Segoe UI Emoji';}
      .wrap{max-width:1100px;margin:0 auto;padding:32px}
      .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.0));border:1px solid #1d2631;border-radius:16px;padding:24px;backdrop-filter: blur(8px);}
      .title{font-weight:700;font-size:28px;letter-spacing:.2px;display:flex;align-items:center;gap:12px}
      .muted{color:var(--muted)}
      .row{display:flex;gap:16px;flex-wrap:wrap}
      .col{flex:1;min-width:260px}
      input,select{width:100%;background:#0e1217;border:1px solid #1b2330;border-radius:12px;padding:12px;color:var(--text);}
      button{padding:12px 16px;border-radius:12px;border:1px solid #283244;background:linear-gradient(180deg,#1b2330,#141a24);color:#eef7ff;cursor:pointer}
      button.primary{border-color:#2f4558;background:linear-gradient(180deg,#26384a,#1a2633)}
      .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #263244;font-size:12px;color:#b6c4d6}
      pre{background:#0d1117;border:1px solid #1b2330;padding:16px;border-radius:12px;overflow:auto}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
      .badge{font-size:12px;border:1px solid #2a3b4f;padding:4px 8px;border-radius:999px;color:#a1b7d1}
      .accent{color:var(--accent)}
      .accent2{color:var(--accent2)}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
